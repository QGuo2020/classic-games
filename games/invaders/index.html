<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>太空侵略者 · 经典小游戏</title>
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050912'/%3E%3Cpath d='M16 6l10 20H6z' fill='none' stroke='%235df2d0' stroke-width='2.5'/%3E%3C/svg%3E">
</head>
<body class="game-page">

<header class="topbar">
  <a class="back" href="../../index.html">← 大厅</a>
  <div class="game-title">太空侵略者<small>Space Shooter</small></div>
  <div class="hud">
    <span class="stat">波次<b id="hudLevel">1</b></span>
    <span class="stat">武器<b id="hudWeapon" class="accent">单发</b></span>
    <span class="stat">分数<b id="hudScore">0</b></span>
    <span class="stat">生命<b id="hudLives" class="accent">3</b></span>
  </div>
  <div class="actions">
    <button class="icon-btn" id="btnSound" title="音效">🔊</button>
    <button class="icon-btn" id="btnTheme" title="主题">☾</button>
  </div>
</header>

<main class="stage-wrap" id="stage">
  <canvas id="c"></canvas>
  <div id="overlay"></div>
</main>

<footer class="toolbar">
  <button class="btn" id="btnRestart">重开 <kbd>R</kbd></button>
  <button class="btn" id="btnPause">暂停 <kbd>P</kbd></button>
  <span class="spacer"></span>
  <span class="note">自动开火 · 左右移动 / 拖动 · 捡 P 升级武器</span>
</footer>

<script src="../../assets/js/core.js"></script>
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('c');
  const $ = (id) => document.getElementById(id);
  const hud = {
    level: $('hudLevel'), weapon: $('hudWeapon'),
    score: $('hudScore'), lives: $('hudLives')
  };

  CG.theme.bind($('btnTheme'));
  CG.soundButton($('btnSound'));

  // 三种外星人，每种两帧动画（致敬原版：章鱼 / 螃蟹 / 鱿鱼）
  const SPRITES = {
    squid: [
      [
        '...XXXXX...',
        '..XXXXXXX..',
        '.XX.XXX.XX.',
        'XXX.XXX.XXX',
        'XXXXXXXXXXX',
        'X.XXXXXXX.X',
        'X.X.....X.X',
        '...XX.XX...'
      ],
      [
        '...XXXXX...',
        '..XXXXXXX..',
        '.XX.XXX.XX.',
        'XXX.XXX.XXX',
        'XXXXXXXXXXX',
        '..XXXXXXX..',
        '.X.XXXXX.X.',
        'X.........X'
      ]
    ],
    crab: [
      [
        '..X.....X..',
        'X..X...X..X',
        'X.XXXXXXX.X',
        'XXX.XXX.XXX',
        'XXXXXXXXXXX',
        '.XXXXXXXXX.',
        '..X.....X..',
        '.X.......X.'
      ],
      [
        '..X.....X..',
        '...X...X...',
        '..XXXXXXX..',
        '.XX.XXX.XX.',
        'XXXXXXXXXXX',
        'X.XXXXXXX.X',
        'X.X.....X.X',
        '...XX.XX...'
      ]
    ],
    octopus: [
      [
        '....XXX....',
        '.XXXXXXXXX.',
        'XXXXXXXXXXX',
        'XXX..X..XXX',
        'XXXXXXXXXXX',
        '...XX.XX...',
        '..XX.X.XX..',
        'XX.......XX'
      ],
      [
        '....XXX....',
        '.XXXXXXXXX.',
        'XXXXXXXXXXX',
        'XXX..X..XXX',
        'XXXXXXXXXXX',
        '..XXX.XXX..',
        '.XX.....XX.',
        '..X.....X..'
      ]
    ]
  };

  // 武器升级链：单发 → 双发 → 三发 → S 弹 → 细激光 → 中激光 → 粗激光
  const WEAPONS = [
    { name: '单发', kind: 'shot', cd: 0.2, offsets: [0] },
    { name: '双发', kind: 'shot', cd: 0.2, offsets: [-7, 7] },
    { name: '三发', kind: 'shot', cd: 0.21, offsets: [-15, 0, 15] },
    { name: 'S 弹', kind: 'spread', cd: 0.3 },
    { name: '细激光', kind: 'laser', width: 7, dps: 5 },
    { name: '中激光', kind: 'laser', width: 12, dps: 8 },
    { name: '粗激光', kind: 'laser', width: 19, dps: 12 }
  ];

  let W = 0, H = 0, ctx = null;
  let paused = false, busy = false;

  const g = {
    level: 1, score: 0, lives: 3,
    weapon: 0,
    player: { x: 0, y: 0, w: 36, h: 20 },
    aliens: [], dir: 1, stepTimer: 0,
    bullets: [], bombs: [], drops: [], particles: [],
    fireTimer: 0,
    bombTimer: 0,
    kills: 0,
    invulnUntil: 0,
    shieldUntil: 0,
    moveTarget: null,
    keys: { left: false, right: false },
    flash: 0,
    laserPulse: 0
  };

  const prog = CG.progress('invaders');
  g.level = Math.max(1, prog.level);

  const now = () => performance.now();

  function syncHud() {
    hud.level.textContent = g.level;
    hud.weapon.textContent = WEAPONS[g.weapon].name;
    hud.score.textContent = g.score;
    hud.lives.textContent = g.lives;
    hud.lives.className = g.lives <= 1 ? 'danger' : 'accent';
  }

  /* -------------------------------------------------- 波次 */

  function buildWave(n) {
    const cols = Math.min(9, 5 + Math.floor((n + 1) / 2));
    const rows = Math.min(6, 4 + Math.floor((n - 1) / 3));
    const cell = Math.min(64, (Math.min(W, 900) - 80) / cols);
    const size = cell * 0.74;
    const ox = (W - cols * cell) / 2 + (cell - size) / 2;
    const oy = 88;
    const armorRows = n >= 5 ? 2 : n >= 2 ? 1 : 0;

    g.aliens = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        g.aliens.push({
          x: ox + c * cell,
          y: oy + r * cell,
          w: size, h: size * 0.86,
          alive: true,
          row: r,
          type: r === 0 ? 'squid' : r <= 2 ? 'crab' : 'octopus',
          hp: r < armorRows ? 2 : 1,
          flash: 0
        });
      }
    }

    g.dir = 1;
    g.stepTimer = 0;
    g.bullets = [];
    g.bombs = [];
    g.drops = [];
    g.particles = [];
    g.fireTimer = 0;
    g.bombTimer = 0.8;
    g.kills = 0;
    g.player.y = H - 56;
    g.player.x = W / 2 - g.player.w / 2;
    g.level = n;
    g.invulnUntil = now() + 900;
    makeStars();
    syncHud();
  }

  function makeStars() {
    g.stars = [];
    const n = Math.max(40, Math.round((W * H) / 16000));
    for (let i = 0; i < n; i++) {
      g.stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() < 0.82 ? 1 : 2,
        a: 0.15 + Math.random() * 0.5,
        v: 4 + Math.random() * 12
      });
    }
  }

  function interval() {
    const alive = g.aliens.filter((a) => a.alive).length;
    const total = Math.max(1, g.aliens.length);
    // 比上一版慢很多，留出躲子弹和捡道具的时间
    return Math.max(160, 640 - g.level * 30 - (1 - alive / total) * 300);
  }

  function stepAliens() {
    const alive = g.aliens.filter((a) => a.alive);
    if (!alive.length) return;

    let minX = Infinity, maxX = -Infinity;
    alive.forEach((a) => { minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x + a.w); });

    const dx = Math.max(8, 12 + g.level);
    if (maxX + dx > W - 12 || minX - dx < 12) {
      g.dir *= -1;
      alive.forEach((a) => { a.y += 16 + g.level * 2; });
    } else {
      alive.forEach((a) => { a.x += dx * g.dir; });
    }

    const bottom = Math.max.apply(null, alive.map((a) => a.y + a.h));
    if (bottom > g.player.y - 8) gameOver('外星人突破防线');
  }

  /* -------------------------------------------------- 开火 */

  function playerCenter() {
    return g.player.x + g.player.w / 2;
  }

  function autoFire(dt) {
    const w = WEAPONS[g.weapon];
    if (w.kind === 'laser') return;   // 激光在 updateLaser 里结算

    g.fireTimer -= dt;
    if (g.fireTimer > 0) return;
    g.fireTimer = w.cd;
    g.muzzle = 0.08;

    const px = playerCenter();
    const py = g.player.y - 4;

    if (w.kind === 'shot') {
      w.offsets.forEach((off) => {
        g.bullets.push({ x: px + off, y: py, vx: 0, vy: -780, dmg: 1 });
      });
    } else {
      // S 弹：五发扇形
      for (let i = -2; i <= 2; i++) {
        const vx = i * 190, vy = -720;
        const len = Math.hypot(vx, vy);
        g.bullets.push({ x: px + (vx / len) * 12, y: py + (vy / len) * 12, vx, vy, dmg: 1 });
      }
    }
    CG.audio.tone(760, 0.03, { type: 'square', vol: 0.014 });
  }

  function updateLaser(dt) {
    const w = WEAPONS[g.weapon];
    if (w.kind !== 'laser') return;

    const beamX = playerCenter();
    const half = w.width / 2;
    g.laserPulse += dt;

    let hitAny = false;
    for (const a of g.aliens) {
      if (!a.alive) continue;
      if (a.x + a.w < beamX - half || a.x > beamX + half) continue;
      if (a.y + a.h < 0) continue;
      hitAny = true;
      a.hp -= w.dps * dt;
      a.flash = 0.12;
      if (a.hp <= 0) killAlien(a);
    }

    if (hitAny && Math.random() < 0.25) {
      CG.audio.tone(320 + Math.random() * 60, 0.02, { type: 'sawtooth', vol: 0.008 });
    }
  }

  function killAlien(a) {
    if (!a.alive) return;
    a.alive = false;
    g.score += 10 + (3 - a.row) * 5;
    g.kills += 1;
    CG.sfx.step();
    for (let i = 0; i < 10; i++) {
      const ang = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 150;
      g.particles.push({
        x: a.x + a.w / 2, y: a.y + a.h / 2,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        life: 0.42, max: 0.42
      });
    }

    // 关卡越高，道具越多
    const chance = 0.07 + g.level * 0.015;
    if (g.kills % 7 === 0 || Math.random() < chance) spawnDrop(a);
    syncHud();

    if (!g.aliens.some((x) => x.alive)) waveClear();
  }

  function spawnDrop(a) {
    const roll = Math.random();
    let type = 'weapon';
    if (roll > 0.86) type = 'life';
    else if (roll > 0.74) type = 'shield';

    g.drops.push({
      x: a.x + a.w / 2,
      y: a.y + a.h / 2,
      vy: 95,
      type,
      born: now(),
      size: Math.max(16, a.w * 0.55)
    });
  }

  function collectDrop(d) {
    if (d.type === 'weapon') {
      if (g.weapon < WEAPONS.length - 1) {
        g.weapon += 1;
        CG.sfx.ok();
        CG.ui.toast('武器升级：' + WEAPONS[g.weapon].name);
      } else {
        g.score += 200;
        CG.sfx.ok();
        CG.ui.toast('武器已满级 +200');
      }
    } else if (d.type === 'shield') {
      g.shieldUntil = now() + 6000;
      CG.sfx.ok();
      CG.ui.toast('护盾 6 秒');
    } else {
      g.lives = Math.min(5, g.lives + 1);
      CG.sfx.ok();
      CG.ui.toast('补给 +1 生命');
    }
    syncHud();
  }

  function hitPlayer() {
    if (now() < g.invulnUntil) return;
    if (now() < g.shieldUntil) {
      g.shieldUntil = 0;
      g.flash = 0.2;
      CG.sfx.bounce();
      return;
    }

    g.lives -= 1;
    g.weapon = Math.max(0, g.weapon - 1);
    g.bombs = [];
    g.flash = 0.4;
    g.invulnUntil = now() + 1600;
    CG.sfx.bad();
    syncHud();

    if (g.lives <= 0) gameOver('战舰被击毁');
    else {
      g.player.x = W / 2 - g.player.w / 2;
      CG.ui.toast('武器降级：' + WEAPONS[g.weapon].name);
    }
  }

  async function waveClear() {
    if (busy) return;
    busy = true;
    CG.sfx.win();
    const n = g.level;
    prog.reach(n + 1);
    prog.win(g.score);
    const r = await CG.ui.modal({
      title: '第 ' + n + ' 波清空',
      text: '得分 <b>' + g.score + '</b> · 武器 <b>' + WEAPONS[g.weapon].name + '</b><br>下一波外星舰队更密，道具也更多。',
      actions: [
        { label: '下一波', value: 'next', primary: true },
        { label: '留在这里', value: 'stay' }
      ]
    });
    busy = false;
    if (r === 'next') {
      g.score += 100;
      g.lives = Math.min(5, g.lives + 1);
      buildWave(n + 1);
    }
  }

  async function gameOver(reason) {
    if (busy) return;
    busy = true;
    CG.sfx.lose();
    const r = await CG.ui.modal({
      title: '防线失守',
      text: (reason || '') + '<br>打到第 <b>' + g.level + '</b> 波，得分 <b>' + g.score + '</b>',
      actions: [
        { label: '再来一局', value: 'retry', primary: true },
        { label: '回到大厅', value: 'exit' }
      ]
    });
    busy = false;
    if (r === 'retry') {
      g.score = 0;
      g.lives = 3;
      g.weapon = 0;
      g.level = 1;
      buildWave(1);
    } else {
      location.href = '../../index.html';
    }
  }

  /* -------------------------------------------------- 更新 */

  function update(dt) {
    if (paused || busy) return;

    const t = now();
    g.flash = Math.max(0, g.flash - dt);
    g.muzzle = Math.max(0, g.muzzle - dt);

    const px = g.player;
    const sp = 470;
    if (g.keys.left) { px.x -= sp * dt; g.moveTarget = null; }
    if (g.keys.right) { px.x += sp * dt; g.moveTarget = null; }
    if (g.moveTarget != null) {
      const goal = g.moveTarget - px.w / 2;
      px.x += (goal - px.x) * Math.min(1, dt * 18);
    }
    px.x = CG.util.clamp(px.x, 10, W - px.w - 10);

    g.stepTimer += dt * 1000;
    if (g.stepTimer >= interval()) {
      g.stepTimer = 0;
      stepAliens();
    }

    autoFire(dt);
    updateLaser(dt);

    // 子弹
    for (let i = g.bullets.length - 1; i >= 0; i--) {
      const b = g.bullets[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if (b.y < -20 || b.x < -20 || b.x > W + 20) { g.bullets.splice(i, 1); continue; }

      for (const a of g.aliens) {
        if (!a.alive) continue;
        if (b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
          a.hp -= b.dmg;
          a.flash = 0.12;
          if (a.hp <= 0) killAlien(a);
          b.dead = true;
          break;
        }
      }
      if (b.dead) g.bullets.splice(i, 1);
    }

    // 外星人炸弹
    g.bombTimer -= dt;
    if (g.bombTimer <= 0 && g.aliens.some((a) => a.alive)) {
      g.bombTimer = Math.max(0.45, 1.1 - g.level * 0.05) + Math.random() * 0.4;
      const shooters = g.aliens.filter((a) => a.alive);
      let a = shooters[Math.floor(Math.random() * shooters.length)];
      if (g.level >= 3 && Math.random() < 0.4) {
        a = shooters.reduce((best, cur) =>
          Math.abs(cur.x + cur.w / 2 - playerCenter()) < Math.abs(best.x + best.w / 2 - playerCenter()) ? cur : best
        , shooters[0]);
      }
      g.bombs.push({ x: a.x + a.w / 2, y: a.y + a.h, vy: 210 + g.level * 14 });
    }

    for (let i = g.bombs.length - 1; i >= 0; i--) {
      const b = g.bombs[i];
      b.y += b.vy * dt;
      if (b.y > H + 10) { g.bombs.splice(i, 1); continue; }
      const p = g.player;
      if (b.x > p.x + 6 && b.x < p.x + p.w - 6 && b.y > p.y - 2 && b.y < p.y + p.h) {
        g.bombs.splice(i, 1);
        hitPlayer();
      }
    }

    // 道具
    for (let i = g.drops.length - 1; i >= 0; i--) {
      const d = g.drops[i];
      d.y += d.vy * dt;
      if (d.y > H + 20) { g.drops.splice(i, 1); continue; }
      const p = g.player;
      if (Math.abs(d.x - (p.x + p.w / 2)) < d.size / 2 + p.w / 2 &&
          Math.abs(d.y - (p.y + p.h / 2)) < d.size / 2 + p.h / 2) {
        g.drops.splice(i, 1);
        collectDrop(d);
      }
    }

    g.aliens.forEach((a) => { a.flash = Math.max(0, a.flash - dt); });

    for (let i = g.particles.length - 1; i >= 0; i--) {
      const px = g.particles[i];
      px.x += px.vx * dt;
      px.y += px.vy * dt;
      px.vx *= 0.96;
      px.life -= dt;
      if (px.life <= 0) g.particles.splice(i, 1);
    }
  }

  /* -------------------------------------------------- 绘制 */

  const FRAME_MS = 420;
  const alienCache = new Map();

  /** 把外星人画到离屏 canvas 一次，之后每帧只 drawImage —— 手机上快很多 */
  function alienSprite(a, type, frame, color) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const key = type + '|' + frame + '|' + color + '|' + Math.round(a.w);
    const hit = alienCache.get(key);
    if (hit) return hit;

    const G = 7;
    const cssW = a.w + G * 2;
    const cssH = a.h + G * 2;
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(cssW * dpr));
    cv.height = Math.max(1, Math.round(cssH * dpr));
    const c2 = cv.getContext('2d');
    c2.scale(dpr, dpr);

    const cw = a.w / 11;
    const ch = a.h / 8;
    c2.fillStyle = color;
    c2.shadowColor = color;
    c2.shadowBlur = 8;
    const rowsS = SPRITES[type][frame];
    for (let r = 0; r < 8; r++) {
      const line = rowsS[r];
      for (let i = 0; i < 11; i++) {
        if (line[i] === 'X') c2.fillRect(G + i * cw, G + r * ch, cw + 0.6, ch + 0.6);
      }
    }

    const spr = { cv, w: cssW, h: cssH, g: G };
    alienCache.set(key, spr);
    return spr;
  }

  function drawAlien(a, c) {
    const type = a.type || 'crab';
    const frame = Math.floor(now() / FRAME_MS + a.row * 0.4) % 2;
    const base = type === 'squid' ? c.hint : type === 'crab' ? c.accent : c.violet;
    const color = a.flash > 0 ? c.text : a.hp > 1 ? c.danger : base;

    const spr = alienSprite(a, type, frame, color);
    ctx.drawImage(spr.cv, a.x - spr.g, a.y - spr.g, spr.w, spr.h);

    if (a.hp > 1) {
      ctx.strokeStyle = c.text;
      ctx.globalAlpha = 0.6;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(a.x - 1, a.y + a.h + 3);
      ctx.lineTo(a.x + a.w + 1, a.y + a.h + 3);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    const c = CG.colors();
    ctx.fillStyle = c.bg;
    ctx.fillRect(0, 0, W, H);

    if (g.flash > 0) {
      ctx.fillStyle = 'rgba(255,93,120,' + (g.flash * 0.3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // 星空
    ctx.fillStyle = c.text;
    (g.stars || []).forEach((st) => {
      ctx.globalAlpha = st.a;
      ctx.fillRect(st.x, st.y, st.r, st.r);
    });
    ctx.globalAlpha = 1;

    // 地面线
    ctx.strokeStyle = c.lineStrong;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, H - 16);
    ctx.lineTo(W, H - 16);
    ctx.stroke();

    g.aliens.forEach((a) => { if (a.alive) drawAlien(a, c); });

    // 爆点
    g.particles.forEach((pt) => {
      ctx.globalAlpha = Math.max(0, pt.life / pt.max);
      ctx.fillStyle = c.hint;
      ctx.fillRect(pt.x - 1.5, pt.y - 1.5, 3, 3);
    });
    ctx.globalAlpha = 1;

    // 激光
    const w = WEAPONS[g.weapon];
    if (w.kind === 'laser') {
      const bx = playerCenter();
      const flicker = 0.85 + 0.15 * Math.sin(g.laserPulse * 40);
      const grad = ctx.createLinearGradient(bx - w.width / 2, 0, bx + w.width / 2, 0);
      grad.addColorStop(0, 'rgba(255,93,120,0)');
      grad.addColorStop(0.5, c.danger);
      grad.addColorStop(1, 'rgba(255,93,120,0)');
      ctx.globalAlpha = flicker;
      ctx.fillStyle = grad;
      ctx.shadowColor = c.danger;
      ctx.shadowBlur = c.light ? 4 : 22;
      ctx.fillRect(bx - w.width / 2, 0, w.width, g.player.y);
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
      // 中心亮线
      ctx.fillStyle = c.text;
      ctx.globalAlpha = 0.95;
      ctx.fillRect(bx - Math.max(1, w.width * 0.12), 0, Math.max(2, w.width * 0.24), g.player.y);
      ctx.globalAlpha = 1;
    }

    // 玩家
    const p = g.player;
    const invuln = now() < g.invulnUntil;
    ctx.globalAlpha = invuln && Math.floor(now() / 90) % 2 ? 0.35 : 1;

    // 尾焰
    const flick = 0.65 + 0.35 * Math.random();
    ctx.fillStyle = c.hint;
    ctx.globalAlpha *= 0.85;
    ctx.beginPath();
    ctx.moveTo(p.x + p.w * 0.43, p.y + p.h * 0.86);
    ctx.lineTo(p.x + p.w * 0.5, p.y + p.h + 11 * flick);
    ctx.lineTo(p.x + p.w * 0.57, p.y + p.h * 0.86);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = invuln && Math.floor(now() / 90) % 2 ? 0.35 : 1;

    // 机身
    ctx.fillStyle = c.text;
    ctx.shadowColor = c.accent;
    ctx.shadowBlur = c.light ? 0 : 16;
    ctx.beginPath();
    ctx.moveTo(p.x + p.w / 2, p.y - 6);
    ctx.lineTo(p.x + p.w * 0.62, p.y + p.h * 0.42);
    ctx.lineTo(p.x + p.w, p.y + p.h * 0.8);
    ctx.lineTo(p.x + p.w * 0.9, p.y + p.h);
    ctx.lineTo(p.x + p.w * 0.58, p.y + p.h * 0.86);
    ctx.lineTo(p.x + p.w * 0.42, p.y + p.h * 0.86);
    ctx.lineTo(p.x + p.w * 0.1, p.y + p.h);
    ctx.lineTo(p.x, p.y + p.h * 0.8);
    ctx.lineTo(p.x + p.w * 0.38, p.y + p.h * 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // 炮口闪光
    if (g.muzzle > 0) {
      ctx.globalAlpha = Math.min(1, g.muzzle * 12);
      const mg = ctx.createRadialGradient(p.x + p.w / 2, p.y - 6, 0, p.x + p.w / 2, p.y - 6, 11);
      mg.addColorStop(0, c.text);
      mg.addColorStop(0.4, c.hint);
      mg.addColorStop(1, 'rgba(255,209,102,0)');
      ctx.fillStyle = mg;
      ctx.beginPath();
      ctx.arc(p.x + p.w / 2, p.y - 6, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 座舱
    ctx.fillStyle = c.accent;
    ctx.beginPath();
    ctx.ellipse(p.x + p.w / 2, p.y + p.h * 0.44, p.w * 0.11, p.h * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // 护盾
    if (now() < g.shieldUntil) {
      ctx.strokeStyle = c.violet;
      ctx.globalAlpha = 0.55 + 0.25 * Math.sin(now() / 120);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x + p.w / 2, p.y + p.h / 2, p.w * 0.85, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 子弹
    if (w.kind !== 'laser') {
      ctx.shadowColor = c.accent;
      ctx.shadowBlur = c.light ? 0 : 10;
      g.bullets.forEach((b) => {
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
        ctx.fillStyle = c.hint;
        ctx.fillRect(-2.2, -9, 4.4, 13);
        ctx.fillStyle = c.text;
        ctx.fillRect(-1, -7, 2, 9);
        ctx.restore();
      });
      ctx.shadowBlur = 0;
    }

    // 炸弹
    g.bombs.forEach((b) => {
      const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 10);
      grad.addColorStop(0, c.text);
      grad.addColorStop(0.35, c.danger);
      grad.addColorStop(1, 'rgba(255,93,120,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(b.x, b.y, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,93,120,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - 12);
      ctx.lineTo(b.x, b.y - 2);
      ctx.stroke();
    });

    // 道具
    g.drops.forEach((d) => {
      const color = d.type === 'weapon' ? c.violet : d.type === 'shield' ? c.accent : c.danger;
      const pulse = 1 + 0.12 * Math.sin(now() / 140);
      const s = d.size * pulse;
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.fillStyle = c.bg;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.shadowColor = color;
      ctx.shadowBlur = c.light ? 0 : 14;
      const r = s * 0.28;
      const half = s / 2;
      ctx.beginPath();
      ctx.moveTo(-half + r, -half);
      ctx.arcTo(half, -half, half, half, r);
      ctx.arcTo(half, half, -half, half, r);
      ctx.arcTo(-half, half, -half, -half, r);
      ctx.arcTo(-half, -half, half, -half, r);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = color;
      ctx.font = '700 ' + Math.round(s * 0.56) + 'px ' + getComputedStyle(document.body).fontFamily;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(d.type === 'weapon' ? 'P' : d.type === 'shield' ? 'S' : '♥', 0, 1);
      ctx.restore();
    });
  }

  /* -------------------------------------------------- 循环 */

  CG.loop((dt) => {
    const fit = CG.util.fit(canvas);
    ctx = fit.ctx;
    if (fit.w !== W || fit.h !== H) {
      const first = W === 0;
      W = fit.w; H = fit.h;
      if (first) buildWave(g.level);
      else g.player.y = H - 56;
    }
    update(dt);
    draw();
  });

  /* -------------------------------------------------- 输入 */

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') g.keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') g.keys.right = true;
    if (e.key === 'r' || e.key === 'R') { if (!busy) buildWave(g.level); }
    if (e.key === 'p' || e.key === 'P') togglePause();
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') g.keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') g.keys.right = false;
  });

  canvas.addEventListener('pointerdown', (e) => {
    const r = canvas.getBoundingClientRect();
    g.moveTarget = e.clientX - r.left;
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!e.buttons) return;
    const r = canvas.getBoundingClientRect();
    g.moveTarget = e.clientX - r.left;
  });

  async function togglePause() {
    if (busy || paused) return;
    paused = true;
    await CG.ui.modal({ title: '已暂停', text: '按 P 或点击继续。', actions: [{ label: '继续', value: 'ok', primary: true }] });
    paused = false;
  }

  $('btnRestart').addEventListener('click', () => { if (!busy) buildWave(g.level); });
  $('btnPause').addEventListener('click', togglePause);

  // 调试钩子
  g.debugWave = buildWave;
  g.debugWeapon = (i) => { g.weapon = CG.util.clamp(i, 0, WEAPONS.length - 1); syncHud(); };
  g.debugDrop = (type) => spawnDrop({ x: g.player.x + g.player.w / 2 - 10, y: g.player.y - 220, w: 20, h: 20 });
  g.debugState = () => ({ weapon: g.weapon, name: WEAPONS[g.weapon].name, bullets: g.bullets.length, drops: g.drops.length });
  window.__game = g;
})();
</script>
</body>
</html>
