<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>僵尸围城 · 经典小游戏</title>
<link rel="stylesheet" href="../../assets/css/theme.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050912'/%3E%3Cpath d='M16 6l10 20H6z' fill='none' stroke='%235df2d0' stroke-width='2.5'/%3E%3C/svg%3E">
<style>
  .up-grid { display: grid; gap: 8px; margin-top: 16px; }
  .up-grid .btn {
    display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
    padding: 11px 14px; text-align: left; line-height: 1.35;
  }
  .up-grid .btn b { font-size: 13.5px; }
  .up-grid .btn span { font-size: 12px; color: var(--text-muted); font-weight: 400; }

  .skills {
    position: absolute; right: 10px; bottom: 10px;
    display: flex; gap: 8px; z-index: 3;
  }
  .skill {
    width: 58px; height: 58px; border-radius: 16px;
    border: 1px solid var(--line-bright);
    background: rgba(12, 20, 34, 0.72);
    color: var(--text);
    font-size: 22px; line-height: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    backdrop-filter: blur(6px);
  }
  .skill small { font-size: 10px; color: var(--text-muted); letter-spacing: 0.04em; }
  .skill.ready { border-color: var(--accent); box-shadow: 0 0 14px var(--accent-soft); }
  .skill.cooling { opacity: 0.55; }
  @media (max-width: 520px) {
    .skills { right: 8px; bottom: 8px; gap: 6px; }
    .skill { width: 50px; height: 50px; font-size: 19px; border-radius: 14px; }
  }
</style>
</head>
<body class="game-page">

<header class="topbar">
  <a class="back" href="../../index.html">← 大厅</a>
  <div class="game-title">僵尸围城<small>Zombie Defense</small></div>
  <div class="hud">
    <span class="stat">波次<b id="hudWave">1</b></span>
    <span class="stat">基地<b id="hudBase" class="accent">10</b></span>
    <span class="stat">击杀<b id="hudKills">0</b></span>
    <span class="stat">伤害<b id="hudDmg">16</b></span>
  </div>
  <div class="actions">
    <button class="icon-btn" id="btnSound" title="音效">🔊</button>
    <button class="icon-btn" id="btnTheme" title="主题">☾</button>
  </div>
</header>

<main class="stage-wrap" id="stage">
  <canvas id="c"></canvas>
  <div class="skills" id="skills">
    <button class="skill ready" id="btnBomb"><span>💣</span><small id="bombLabel">炸弹</small></button>
    <button class="skill ready" id="btnFreeze"><span>❄️</span><small id="freezeLabel">冰冻</small></button>
  </div>
  <div id="overlay"></div>
</main>

<footer class="toolbar">
  <button class="btn" id="btnRestart">重开 <kbd>R</kbd></button>
  <button class="btn" id="btnPause">暂停 <kbd>P</kbd></button>
  <span class="spacer"></span>
  <span class="note">点哪打哪（不点就自动瞄准）· 拖动画布走位</span>
</footer>

<script src="../../assets/js/core.js"></script>
<script>
(function () {
  'use strict';

  const canvas = document.getElementById('c');
  const $ = (id) => document.getElementById(id);
  const hud = {
    wave: $('hudWave'), base: $('hudBase'),
    kills: $('hudKills'), dmg: $('hudDmg')
  };

  CG.theme.bind($('btnTheme'));
  CG.soundButton($('btnSound'));

  let W = 0, H = 0, ctx = null;
  let paused = false, busy = false;

  const g = {
    wave: 1,
    base: 10,
    baseMax: 10,
    kills: 0,
    coins: 0,
    level: 1,
    need: 12,

    dmg: 16,
    rate: 0.28,
    multi: 1,
    pierce: 0,
    crit: 0.05,
    freeze: false,
    bulletSpeed: 900,

    zombies: [],
    bullets: [],
    particles: [],
    spawnTimer: 1.2,
    waveTimer: 30,
    fireTimer: 0,
    pending: 0,
    hero: { x: 0, y: 0, w: 30, h: 30 },
    aim: null,
    targetX: null,
    keys: { left: false, right: false },
    shake: 0,
    flash: 0,
    muzzle: 0,
    aimX: null,
    aimY: null,
    floats: [],
    skillBomb: 0,
    skillFreeze: 0
  };

  const prog = CG.progress('zombies');

  const UPGRADES = [
    { id: 'dmg', name: '火力强化', desc: () => '伤害 ' + Math.round(g.dmg) + ' → ' + Math.round(g.dmg * 1.2), apply: () => { g.dmg *= 1.2; } },
    { id: 'rate', name: '快速射击', desc: () => '射击间隔 ' + g.rate.toFixed(2) + 's → ' + Math.max(0.12, g.rate * 0.85).toFixed(2) + 's', apply: () => { g.rate = Math.max(0.12, g.rate * 0.85); } },
    { id: 'multi', name: '多重射击', desc: () => '同时攻击 ' + g.multi + ' → ' + Math.min(5, g.multi + 1) + ' 个目标', apply: () => { g.multi = Math.min(5, g.multi + 1); }, maxed: () => g.multi >= 5 },
    { id: 'pierce', name: '穿甲弹', desc: () => '穿透 ' + g.pierce + ' → ' + (g.pierce + 1) + ' 个僵尸', apply: () => { g.pierce += 1; } },
    { id: 'freeze', name: '冰霜弹', desc: '命中后减速 40%，持续 2 秒', apply: () => { g.freeze = true; }, maxed: () => g.freeze },
    { id: 'crit', name: '致命一击', desc: () => '暴击率 ' + Math.round(g.crit * 100) + '% → ' + Math.round(Math.min(0.7, g.crit + 0.1) * 100) + '%（双倍伤害）', apply: () => { g.crit = Math.min(0.7, g.crit + 0.1); }, maxed: () => g.crit >= 0.7 },
    { id: 'repair', name: '抢修基地', desc: '基地立刻恢复 2 点', apply: () => { g.base = Math.min(g.baseMax, g.base + 2); } },
    { id: 'speed', name: '高速弹', desc: '子弹飞行速度 +25%', apply: () => { g.bulletSpeed *= 1.25; } }
  ];

  const TYPES = {
    walker: { hp: 1, speed: 1, size: 30, colors: ['#7ee787', '#86efac', '#6ee7b7'], score: 1 },
    runner: { hp: 0.6, speed: 2.1, size: 26, colors: ['#ffd166', '#fbbf24', '#fde68a'], score: 1 },
    tank: { hp: 3.2, speed: 0.62, size: 42, colors: ['#ff9f6e', '#fb923c', '#fca5a5'], score: 2 },
    boss: { hp: 9, speed: 0.42, size: 60, colors: ['#ff5d78', '#f43f5e'], score: 6 }
  };

  function syncHud() {
    hud.wave.textContent = g.wave;
    hud.base.textContent = Math.max(0, g.base);
    hud.base.className = g.base <= 3 ? 'danger' : 'accent';
    hud.kills.textContent = g.kills;
    hud.dmg.textContent = Math.round(g.dmg);
    syncSkills();
  }

  function syncSkills() {
    const bomb = $('btnBomb');
    const freeze = $('btnFreeze');
    bomb.classList.toggle('cooling', g.skillBomb > 0);
    bomb.classList.toggle('ready', g.skillBomb <= 0);
    freeze.classList.toggle('cooling', g.skillFreeze > 0);
    freeze.classList.toggle('ready', g.skillFreeze <= 0);
    $('bombLabel').textContent = g.skillBomb > 0 ? Math.ceil(g.skillBomb) + 's' : '炸弹';
    $('freezeLabel').textContent = g.skillFreeze > 0 ? Math.ceil(g.skillFreeze) + 's' : '冰冻';
  }

  function reset() {
    g.wave = 1;
    g.base = g.baseMax;
    g.kills = 0;
    g.coins = 0;
    g.level = 1;
    g.need = 12;
    g.dmg = 16;
    g.rate = 0.28;
    g.multi = 1;
    g.pierce = 0;
    g.crit = 0.05;
    g.freeze = false;
    g.bulletSpeed = 900;
    g.zombies = [];
    g.bullets = [];
    g.particles = [];
    g.spawnTimer = 1.2;
    g.waveTimer = 24;
    g.fireTimer = 0;
    g.pending = 0;
    g.hero.x = W / 2;
    g.hero.y = H - 86;
    g.shake = 0;
    g.flash = 0;
    g.muzzle = 0;
    g.aimX = null;
    g.aimY = null;
    g.floats = [];
    g.skillBomb = 0;
    g.skillFreeze = 0;

    // 开局先给三只，别让画面空着
    for (let i = 0; i < 3; i++) {
      spawnZombie('walker');
      const z = g.zombies[g.zombies.length - 1];
      z.y = 90 + i * 130;
    }

    syncHud();
  }

  /* -------------------------------------------------- 僵尸 */

  function hpBase() { return 30 + g.wave * 16; }
  function speedBase() { return 34 + g.wave * 1.6; }

  function spawnZombie(type) {
    const t = TYPES[type];
    const size = t.size * (0.9 + Math.random() * 0.2);
    const x = 30 + Math.random() * (W - 60);
    const hp = hpBase() * t.hp * (type === 'boss' ? 1 : 1 + g.wave * 0.05);

    g.zombies.push({
      type,
      x, y: -size,
      w: size, h: size * 1.15,
      hp, maxHp: hp,
      speed: speedBase() * t.speed * (0.9 + Math.random() * 0.25),
      slowUntil: 0,
      wobble: Math.random() * Math.PI * 2,
      phase: Math.random() * Math.PI * 2,
      hit: 0,
      color: t.colors[Math.floor(Math.random() * t.colors.length)]
    });
  }

  function pickType() {
    const r = Math.random();
    if (r < 0.16 && g.wave >= 1) return 'runner';
    if (r < 0.32 && g.wave >= 2) return 'tank';
    return 'walker';
  }

  function damageZombie(z, amount) {
    z.hp -= amount;
    z.hit = 0.12;
    if (g.floats.length < 40) {
      g.floats.push({
        x: z.x + (Math.random() - 0.5) * z.w * 0.6,
        y: z.y + z.h * 0.15,
        text: '-' + Math.round(amount),
        life: 0.7,
        max: 0.7,
        big: amount >= g.dmg * 1.9
      });
    }
    if (z.hp <= 0) killZombie(z);
  }

  function killZombie(z) {
    const i = g.zombies.indexOf(z);
    if (i < 0) return;
    g.zombies.splice(i, 1);
    g.kills += 1;
    g.coins += TYPES[z.type].score;

    burst(z.x, z.y + z.h / 2, z.color, z.type === 'boss' ? 22 : 8);
    CG.sfx.step();

    while (g.coins >= g.need) {
      g.coins -= g.need;
      g.level += 1;
      g.need = 10 + g.level * 4;
      g.pending += 1;
    }
    syncHud();
  }

  function levelUp() {
    if (busy) return;
    busy = true;
    const pool = UPGRADES.filter((u) => !u.maxed || !u.maxed());
    const picks = [];
    const copy = pool.slice();
    while (picks.length < Math.min(3, copy.length)) {
      picks.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
    }

    pickUpgrade(picks).then((choice) => {
      choice.apply();
      CG.sfx.ok();
      busy = false;
      syncHud();
    });
  }

  function pickUpgrade(picks) {
    return new Promise((resolve) => {
      const host = document.getElementById('overlay');
      host.innerHTML = '';

      const mask = document.createElement('div');
      mask.className = 'modal-mask';

      const card = document.createElement('div');
      card.className = 'modal';
      card.style.width = 'min(440px, 100%)';

      const title = document.createElement('h2');
      title.textContent = '升级 · 第 ' + g.level + ' 级';
      const sub = document.createElement('p');
      sub.textContent = '选一个强化，继续守住防线';

      const grid = document.createElement('div');
      grid.className = 'up-grid';

      picks.forEach((u) => {
        const b = document.createElement('button');
        b.className = 'btn';
        b.innerHTML = '<b>' + u.name + '</b><span>' + (typeof u.desc === 'function' ? u.desc() : u.desc) + '</span>';
        b.addEventListener('click', () => {
          host.classList.remove('show');
          host.innerHTML = '';
          resolve(u);
        });
        grid.appendChild(b);
      });

      card.appendChild(title);
      card.appendChild(sub);
      card.appendChild(grid);
      mask.appendChild(card);
      host.appendChild(mask);
      host.classList.add('show');
    });
  }

  /* -------------------------------------------------- 战斗 */

  function nearestTargets(n) {
    if (!g.zombies.length) return [];
    let sorted;

    if (g.aimX != null) {
      // 玩家点过屏幕：优先打离点击位置最近的
      sorted = g.zombies.slice().sort((a, b) => {
        const da = (a.x - g.aimX) * (a.x - g.aimX) + (a.y + a.h / 2 - g.aimY) * (a.y + a.h / 2 - g.aimY);
        const db = (b.x - g.aimX) * (b.x - g.aimX) + (b.y + b.h / 2 - g.aimY) * (b.y + b.h / 2 - g.aimY);
        return da - db;
      });
    } else {
      // 没点过就自动打最靠前（离基地最近）的
      sorted = g.zombies.slice().sort((a, b) => (b.y + b.h) - (a.y + a.h));
    }

    return sorted.slice(0, n);
  }

  function fire() {
    const targets = nearestTargets(g.multi);
    if (!targets.length) { g.aim = null; return; }

    const hx = g.hero.x;
    const hy = g.hero.y - 12;
    const nowTs = performance.now();

    targets.forEach((z) => {
      // 提前量：僵尸一直在往下走，直接瞄准当前位置会打空
      let tx = z.x;
      let ty = z.y + z.h / 2;
      for (let i = 0; i < 3; i++) {
        const dist = Math.hypot(tx - hx, ty - hy) || 1;
        const flight = dist / g.bulletSpeed;
        const slow = nowTs < z.slowUntil ? 0.6 : 1;
        ty = z.y + z.h / 2 + z.speed * slow * flight;
        tx = z.x;
      }

      const dx = tx - hx, dy = ty - hy;
      const len = Math.hypot(dx, dy) || 1;
      const crit = Math.random() < g.crit;

      g.bullets.push({
        x: hx, y: hy,
        vx: (dx / len) * g.bulletSpeed,
        vy: (dy / len) * g.bulletSpeed,
        dmg: g.dmg * (crit ? 2 : 1),
        crit,
        pierce: g.pierce,
        freeze: g.freeze
      });
    });

    g.shots = (g.shots || 0) + targets.length;
    g.aim = targets[0];
    g.muzzle = 0.09;
    CG.audio.tone(660, 0.03, { type: 'square', vol: 0.012 });
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 150;
      g.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.35 + Math.random() * 0.3, max: 0.65, color
      });
    }
    if (g.particles.length > 220) g.particles.splice(0, g.particles.length - 220);
  }

  function hurtBase(amount) {
    g.base -= amount;
    g.shake = 0.35;
    g.flash = 0.3;
    CG.sfx.bad();
    syncHud();
    if (g.base <= 0) gameOver();
  }

  async function gameOver() {
    if (busy) return;
    busy = true;
    CG.sfx.lose();
    prog.reach(Math.max(prog.data.max, g.wave));
    prog.win(g.kills);
    const r = await CG.ui.modal({
      title: '基地失守',
      text: '守到第 <b>' + g.wave + '</b> 波，击杀 <b>' + g.kills + '</b> 只<br>历史最佳：第 ' + prog.data.max + ' 波 · 最高击杀 ' + prog.data.best,
      actions: [
        { label: '再来一局', value: 'retry', primary: true },
        { label: '回到大厅', value: 'exit' }
      ]
    });
    busy = false;
    if (r === 'retry') reset();
    else location.href = '../../index.html';
  }

  /* -------------------------------------------------- 更新 */

  function update(dt) {
    if (paused || busy) return;

    const t = performance.now();
    g.shake = Math.max(0, g.shake - dt);
    g.muzzle = Math.max(0, g.muzzle - dt);
    g.flash = Math.max(0, g.flash - dt);

    // 技能冷却
    if (g.skillBomb > 0) g.skillBomb = Math.max(0, g.skillBomb - dt);
    if (g.skillFreeze > 0) g.skillFreeze = Math.max(0, g.skillFreeze - dt);
    g.skillHud = (g.skillHud || 0) + dt;
    if (g.skillHud > 0.2) { g.skillHud = 0; syncSkills(); }

    // 飘字
    for (let i = g.floats.length - 1; i >= 0; i--) {
      const f = g.floats[i];
      f.y -= 42 * dt;
      f.life -= dt;
      if (f.life <= 0) g.floats.splice(i, 1);
    }

    // 英雄走位
    const sp = 320;
    if (g.keys.left) g.hero.x -= sp * dt;
    if (g.keys.right) g.hero.x += sp * dt;
    if (g.targetX != null) {
      g.hero.x += (g.targetX - g.hero.x) * Math.min(1, dt * 14);
    }
    g.hero.x = CG.util.clamp(g.hero.x, 24, W - 24);
    g.hero.y = H - 86;

    // 波次推进
    g.waveTimer -= dt;
    if (g.waveTimer <= 0) {
      g.wave += 1;
      g.waveTimer = 24;
      if (g.wave % 5 === 0) {
        spawnZombie('boss');
        CG.ui.toast('第 ' + g.wave + ' 波 · 巨型僵尸出现');
      } else {
        CG.ui.toast('第 ' + g.wave + ' 波');
      }
      syncHud();
    }

    // 刷怪
    g.spawnTimer -= dt;
    if (g.spawnTimer <= 0) {
      g.spawnTimer = Math.max(0.4, 0.8 - g.wave * 0.05) * (0.8 + Math.random() * 0.3);
      const count = 1 + (g.wave >= 6 && Math.random() < 0.3 ? 1 : 0);
      for (let i = 0; i < count; i++) spawnZombie(pickType());
    }

    // 僵尸前进
    const baseLine = H - 54;
    for (let i = g.zombies.length - 1; i >= 0; i--) {
      const z = g.zombies[i];
      z.hit = Math.max(0, z.hit - dt);
      const slow = t < z.slowUntil ? 0.6 : 1;
      z.y += z.speed * slow * dt;
      z.wobble += dt * 3;
      z.phase += dt * (3 + z.speed * 0.12);
      z.x += Math.sin(z.wobble) * 6 * dt;

      if (z.y + z.h >= baseLine) {
        g.zombies.splice(i, 1);
        burst(z.x, baseLine - 10, z.color, 10);
        hurtBase(z.type === 'boss' ? 3 : 1);
        if (busy) return;
      }
    }

    // 自动开火
    g.fireTimer -= dt;
    if (g.fireTimer <= 0) {
      g.fireTimer = g.rate;
      fire();
    }

    // 子弹（分步推进 + 扫掠判定，速度快也不会穿模）
    for (let i = g.bullets.length - 1; i >= 0; i--) {
      const b = g.bullets[i];
      const travel = Math.hypot(b.vx, b.vy) * dt;
      const steps = Math.max(1, Math.ceil(travel / 7));
      const sdt = dt / steps;
      let gone = false;

      for (let s = 0; s < steps && !gone; s++) {
        b.x += b.vx * sdt;
        b.y += b.vy * sdt;

        if (b.y < -30 || b.y > H + 30 || b.x < -30 || b.x > W + 30) {
          g.bullets.splice(i, 1);
          gone = true;
          break;
        }

        for (const z of g.zombies) {
          if (b.x > z.x - z.w / 2 && b.x < z.x + z.w / 2 &&
              b.y > z.y && b.y < z.y + z.h) {
            g.hits = (g.hits || 0) + 1;
            damageZombie(z, b.dmg);
            if (b.freeze) z.slowUntil = t + 2000;
            if (b.pierce > 0) b.pierce -= 1;
            else {
              g.bullets.splice(i, 1);
              gone = true;
            }
            break;
          }
        }
      }
    }

    // 粒子
    for (let i = g.particles.length - 1; i >= 0; i--) {
      const p = g.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 160 * dt;
      p.life -= dt;
      if (p.life <= 0) g.particles.splice(i, 1);
    }

    // 攒够经验就弹升级（一次只弹一个）
    if (g.pending > 0 && !busy) {
      g.pending -= 1;
      levelUp();
    }
  }

  /* -------------------------------------------------- 绘制 */

  const zombieCache = new Map();

  /** 把僵尸画进离屏 canvas（按步态分 8 档），每帧只 drawImage */
  function drawZombieShape(g2, t, w, h, color, swing) {
    const headR = w * (t === 'tank' ? 0.42 : t === 'runner' ? 0.38 : 0.44);
    const headY = -h * 0.14;
    const bodyW = w * (t === 'tank' ? 0.74 : t === 'runner' ? 0.5 : 0.6);
    const bodyH = h * (t === 'tank' ? 0.3 : 0.26);
    const bodyTop = headY + headR * 0.62;

    // 影子
    g2.fillStyle = 'rgba(0,0,0,0.28)';
    g2.beginPath();
    g2.ellipse(0, h * 0.46, w * 0.4, h * 0.07, 0, 0, Math.PI * 2);
    g2.fill();

    g2.shadowColor = color;
    g2.shadowBlur = 11;

    // 腿
    g2.fillStyle = color;
    g2.globalAlpha = 0.92;
    const legW = w * 0.17;
    const legH = h * 0.15;
    const legTop = bodyTop + bodyH * 0.92;
    g2.fillRect(-w * 0.2 + swing * w * 0.05, legTop, legW, legH);
    g2.fillRect(w * 0.03 - swing * w * 0.05, legTop, legW, legH);

    // 身体（圆润）
    g2.globalAlpha = 0.97;
    const br = bodyW * 0.34;
    g2.beginPath();
    g2.moveTo(-bodyW / 2 + br, bodyTop);
    g2.arcTo(bodyW / 2, bodyTop, bodyW / 2, bodyTop + bodyH, br);
    g2.arcTo(bodyW / 2, bodyTop + bodyH, -bodyW / 2, bodyTop + bodyH, br);
    g2.arcTo(-bodyW / 2, bodyTop + bodyH, -bodyW / 2, bodyTop, br);
    g2.arcTo(-bodyW / 2, bodyTop, bodyW / 2, bodyTop, br);
    g2.closePath();
    g2.fill();

    // 手臂
    g2.globalAlpha = 0.88;
    const armW = w * 0.15;
    const armH = h * 0.2;
    const armY = bodyTop + h * 0.01;
    g2.fillRect(-bodyW / 2 - armW * 0.95, armY + swing * h * 0.02, armW, armH);
    g2.fillRect(bodyW / 2 - armW * 0.05, armY - swing * h * 0.02, armW, armH);

    // 大头
    g2.globalAlpha = 1;
    g2.beginPath();
    g2.arc(0, headY, headR, 0, Math.PI * 2);
    g2.fill();
    g2.shadowBlur = 0;

    // 白眼球 + 瞳孔
    const eyeR = headR * 0.3;
    g2.fillStyle = 'rgba(255,255,255,0.94)';
    g2.beginPath();
    g2.arc(-headR * 0.36, headY - headR * 0.06, eyeR, 0, Math.PI * 2);
    g2.arc(headR * 0.36, headY - headR * 0.06, eyeR, 0, Math.PI * 2);
    g2.fill();

    g2.fillStyle = t === 'boss' ? '#ffd166' : 'rgba(5,9,18,0.94)';
    g2.beginPath();
    g2.arc(-headR * 0.3, headY - headR * 0.04, eyeR * 0.48, 0, Math.PI * 2);
    g2.arc(headR * 0.42, headY - headR * 0.04, eyeR * 0.48, 0, Math.PI * 2);
    g2.fill();

    // 嘴：两颗小牙
    g2.fillStyle = 'rgba(5,9,18,0.55)';
    g2.fillRect(-headR * 0.3, headY + headR * 0.34, headR * 0.6, Math.max(1.6, headR * 0.14));

    // 配件
    if (t === 'runner') {
      // 头巾
      g2.fillStyle = 'rgba(5,9,18,0.45)';
      g2.fillRect(-headR * 0.95, headY - headR * 0.72, headR * 1.9, headR * 0.26);
    }
    if (t === 'tank') {
      // 头盔
      g2.fillStyle = 'rgba(5,9,18,0.35)';
      g2.beginPath();
      g2.arc(0, headY, headR * 1.06, Math.PI * 1.05, Math.PI * 1.95);
      g2.fill();
      // 胸甲
      g2.fillRect(-bodyW * 0.36, bodyTop + bodyH * 0.18, bodyW * 0.72, bodyH * 0.34);
    }
    if (t === 'boss') {
      // 肩刺
      g2.fillStyle = color;
      for (let i = -1; i <= 1; i += 2) {
        g2.beginPath();
        g2.moveTo(i * bodyW * 0.5, bodyTop + h * 0.03);
        g2.lineTo(i * bodyW * 0.66, bodyTop - h * 0.1);
        g2.lineTo(i * bodyW * 0.36, bodyTop + h * 0.03);
        g2.closePath();
        g2.fill();
      }
      // 皇冠
      g2.fillStyle = '#ffd166';
      g2.beginPath();
      g2.moveTo(-headR * 0.62, headY - headR * 0.85);
      g2.lineTo(-headR * 0.4, headY - headR * 1.45);
      g2.lineTo(0, headY - headR * 0.92);
      g2.lineTo(headR * 0.4, headY - headR * 1.45);
      g2.lineTo(headR * 0.62, headY - headR * 0.85);
      g2.closePath();
      g2.fill();
    }
  }

  function drawZombie(z, c) {
    const t = z.type;
    const w = z.w, h = z.h;
    const color = z.hit > 0 ? '#ffffff' : z.color;
    const step = Math.round(((z.phase % (Math.PI * 2)) / (Math.PI * 2)) * 8) % 8;
    const key = t + '|' + color + '|' + step + '|' + Math.round(w);

    let spr = zombieCache.get(key);
    if (!spr) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const G = 12;
      const cssW = w + G * 2;
      const cssH = h + G * 2;
      const cv = document.createElement('canvas');
      cv.width = Math.round(cssW * dpr);
      cv.height = Math.round(cssH * dpr);
      const c2 = cv.getContext('2d');
      c2.scale(dpr, dpr);
      c2.translate(G + w / 2, G + h / 2);
      drawZombieShape(c2, t, w, h, color, Math.sin((step / 8) * Math.PI * 2));
      spr = { cv, w: cssW, h: cssH, g: G };
      zombieCache.set(key, spr);
    }

    ctx.drawImage(spr.cv, z.x - w / 2 - spr.g, z.y + h / 2 - spr.g, spr.w, spr.h);

    // 血条：一直显示，残血变红
    {
      const bwid = Math.max(w * 1.15, 22);
      const bxx = z.x - bwid / 2;
      const byy = z.y - 9;
      const ratio = Math.max(0, z.hp / z.maxHp);
      ctx.globalAlpha = ratio < 1 ? 0.95 : 0.4;
      ctx.fillStyle = c.line;
      ctx.fillRect(bxx, byy, bwid, 3.5);
      ctx.fillStyle = ratio < 0.35 ? c.danger : t === 'boss' ? c.danger : c.hint;
      ctx.fillRect(bxx, byy, bwid * ratio, 3.5);
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    const c = CG.colors();
    ctx.save();
    if (g.shake > 0) {
      const s = g.shake * 8;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    ctx.fillStyle = c.bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 背景网格
    ctx.strokeStyle = c.line;
    ctx.lineWidth = 1;
    for (let y = 0; y < H; y += 56) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }

    if (g.flash > 0) {
      ctx.fillStyle = 'rgba(255,93,120,' + (g.flash * 0.3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // 基地墙
    const baseLine = H - 54;
    ctx.fillStyle = c.light ? 'rgba(45,72,100,0.16)' : 'rgba(164,190,225,0.14)';
    ctx.fillRect(0, baseLine, W, 38);
    // 城墙垛口
    for (let x = 0; x < W; x += 30) ctx.fillRect(x, baseLine - 6, 16, 6);
    ctx.strokeStyle = c.accent;
    ctx.globalAlpha = 0.8;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, baseLine);
    ctx.lineTo(W, baseLine);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // 基地血量小格
    const segW = 16;
    for (let i = 0; i < g.baseMax; i++) {
      const x = 10 + i * (segW + 4);
      ctx.fillStyle = i < g.base ? c.accent : c.line;
      ctx.fillRect(x, baseLine + 14, segW, 8);
    }

    // 僵尸
    g.zombies.forEach((z) => drawZombie(z, c));

    // 子弹
    g.bullets.forEach((b) => {
      ctx.strokeStyle = b.crit ? c.hint : c.text;
      ctx.lineWidth = b.crit ? 3 : 2;
      ctx.shadowColor = b.crit ? c.hint : c.accent;
      ctx.shadowBlur = c.light ? 0 : 10;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x - b.vx * 0.012, b.y - b.vy * 0.012);
      ctx.stroke();
      ctx.shadowBlur = 0;
    });

    // 粒子
    g.particles.forEach((p) => {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    });
    ctx.globalAlpha = 1;

    // 伤害飘字
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    g.floats.forEach((f) => {
      ctx.globalAlpha = Math.max(0, f.life / f.max);
      ctx.fillStyle = f.big ? c.hint : c.text;
      ctx.font = (f.big ? '700 ' : '600 ') + Math.round(f.big ? 17 : 13) + 'px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillText(f.text, f.x, f.y);
    });
    ctx.globalAlpha = 1;

    // 瞄准点
    if (g.aimX != null) {
      const pulse = 8 + 3 * Math.sin(performance.now() / 160);
      ctx.strokeStyle = c.accent;
      ctx.globalAlpha = 0.75;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(g.aimX, g.aimY, pulse, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(g.aimX - pulse - 5, g.aimY);
      ctx.lineTo(g.aimX - pulse + 2, g.aimY);
      ctx.moveTo(g.aimX + pulse - 2, g.aimY);
      ctx.lineTo(g.aimX + pulse + 5, g.aimY);
      ctx.moveTo(g.aimX, g.aimY - pulse - 5);
      ctx.lineTo(g.aimX, g.aimY - pulse + 2);
      ctx.moveTo(g.aimX, g.aimY + pulse - 2);
      ctx.lineTo(g.aimX, g.aimY + pulse + 5);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 英雄
    const hx = g.hero.x, hy = g.hero.y;
    const aim = g.aim && g.zombies.includes(g.aim) ? g.aim : nearestTargets(1)[0];
    let angle = -Math.PI / 2;
    if (aim) angle = Math.atan2((aim.y + aim.h / 2) - hy, aim.x - hx);

    // 底座
    ctx.fillStyle = c.light ? 'rgba(45,72,100,0.18)' : 'rgba(164,190,225,0.16)';
    ctx.beginPath();
    ctx.ellipse(hx, hy + 18, 26, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // 炮管
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(angle + Math.PI / 2);
    ctx.fillStyle = c.text;
    ctx.shadowColor = c.accent;
    ctx.shadowBlur = c.light ? 0 : 14;
    ctx.fillRect(-4, -30, 8, 30);
    ctx.shadowBlur = 0;

    // 炮口火焰
    if (g.muzzle > 0) {
      ctx.fillStyle = c.hint;
      ctx.globalAlpha = Math.min(1, g.muzzle * 12);
      ctx.beginPath();
      ctx.arc(0, -32, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    // 炮塔
    ctx.fillStyle = c.accent;
    ctx.shadowColor = c.accent;
    ctx.shadowBlur = c.light ? 0 : 16;
    ctx.beginPath();
    ctx.arc(hx, hy + 8, 15, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = c.bg;
    ctx.beginPath();
    ctx.arc(hx, hy + 8, 7, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  /* -------------------------------------------------- 循环 */

  CG.loop((dt) => {
    const fit = CG.util.fit(canvas);
    ctx = fit.ctx;
    if (fit.w !== W || fit.h !== H) {
      const first = W === 0;
      W = fit.w; H = fit.h;
      if (first) reset();
    }
    update(dt);
    draw();
  });

  /* -------------------------------------------------- 输入 */

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') { g.keys.left = true; g.targetX = null; }
    if (e.key === 'ArrowRight' || e.key === 'd') { g.keys.right = true; g.targetX = null; }
    if (e.key === 'r' || e.key === 'R') { if (!busy) reset(); }
    if (e.key === 'p' || e.key === 'P') togglePause();
  });
  document.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a') g.keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') g.keys.right = false;
  });

  canvas.addEventListener('pointerdown', (e) => {
    const r = canvas.getBoundingClientRect();
    g.aimX = e.clientX - r.left;
    g.aimY = e.clientY - r.top;
    g.targetX = g.aimX;
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!e.buttons) return;
    const r = canvas.getBoundingClientRect();
    g.targetX = e.clientX - r.left;
  });

  canvas.addEventListener('dblclick', () => { g.aimX = null; g.aimY = null; });

  /* -------------------------------------------------- 技能 */

  function useBomb() {
    if (busy || g.skillBomb > 0) return;
    g.skillBomb = 18;
    g.flash = 0.35;
    g.shake = 0.45;
    const dmg = g.dmg * 6;
    g.zombies.slice().forEach((z) => {
      burst(z.x, z.y + z.h / 2, '#ffd166', 6);
      damageZombie(z, dmg);
    });
    CG.sfx.hit();
    syncHud();
    CG.ui.toast('炸弹！全场伤害 ' + Math.round(dmg));
  }

  function useFreeze() {
    if (busy || g.skillFreeze > 0) return;
    g.skillFreeze = 22;
    const until = performance.now() + 4000;
    g.zombies.forEach((z) => { z.slowUntil = Math.max(z.slowUntil, until); });
    CG.sfx.ok();
    syncHud();
    CG.ui.toast('冰冻 4 秒');
  }

  $('btnBomb').addEventListener('click', useBomb);
  $('btnFreeze').addEventListener('click', useFreeze);

  async function togglePause() {
    if (busy || paused) return;
    paused = true;
    await CG.ui.modal({ title: '已暂停', text: '按 P 或点击继续。', actions: [{ label: '继续', value: 'ok', primary: true }] });
    paused = false;
  }

  $('btnRestart').addEventListener('click', () => { if (!busy) reset(); });
  $('btnPause').addEventListener('click', togglePause);

  // 调试钩子
  g.debugSpawn = spawnZombie;
  g.debugState = () => ({ zombies: g.zombies.length, bullets: g.bullets.length, base: g.base, kills: g.kills, level: g.level, shots: g.shots || 0, hits: g.hits || 0, hero: { x: Math.round(g.hero.x), y: Math.round(g.hero.y) }, z0: g.zombies[0] ? { x: Math.round(g.zombies[0].x), y: Math.round(g.zombies[0].y), w: Math.round(g.zombies[0].w) } : null, b0: g.bullets[0] ? { x: Math.round(g.bullets[0].x), y: Math.round(g.bullets[0].y), vx: Math.round(g.bullets[0].vx), vy: Math.round(g.bullets[0].vy) } : null, W: W, H: H });
  window.__game = g;
})();
</script>
<script>
(function () {
  setTimeout(function () {
    if (window.__game) return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:0;right:0;top:0;bottom:0;z-index:99999;display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;justify-content:center;padding:24px;background:#050912;color:#eef4ff;font:14px/1.8 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;text-align:center';
    d.innerHTML = '<div>这个浏览器内核太旧，跑不动这个游戏。<br>请换 Chrome / Safari / UC 打开，或者点右上角「···」用系统浏览器打开。</div>';
    document.body.appendChild(d);
  }, 2500);
})();
</script></body>
